<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9f7f2">
  <meta name="description" content="CareBridge — an accessible daily check-in app concept for older adults and their families.">
  <title>CareBridge — A little check-in. A lot of peace of mind.</title>
  <style>
    :root {
      --bg:#f7f7f2; --panel:#fffefa; --surface:#ffffff; --ink:#183b37; --muted:#5e756f;
      --line:#dfe8e0; --green:#117461; --green-dark:#0a5d4c; --green-light:#e5f6ec;
      --peach:#fff0dc; --orange:#b54e23; --warning-bg:#fff2e6; --red:#a92f32;
      --shadow:0 16px 60px rgba(18,61,54,.06); --focus:#165fbe; --font-scale:1;
    }
    *{box-sizing:border-box}
    html{font-size:calc(16px * var(--font-scale));scroll-behavior:smooth}
    body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;line-height:1.48}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.54}
    :focus-visible{outline:3px solid var(--focus);outline-offset:3px}
    .app-shell{min-height:100vh;display:grid;grid-template-columns:260px 1fr}
    aside{background:#fbfcf8;border-right:1px solid var(--line);padding:32px 18px;display:flex;flex-direction:column;gap:32px;position:sticky;top:0;height:100vh}
    .brand{display:flex;align-items:center;gap:12px;padding:3px 12px}
    .brand-mark{height:46px;width:46px;border-radius:16px;background:var(--green);display:grid;place-items:center;color:white;font-size:27px;line-height:1;box-shadow:0 6px 15px #12746125}
    .brand strong{font-size:1.37rem;letter-spacing:-.05em;display:block;line-height:1.1}
    .brand small{font-size:.73rem;display:block;color:var(--muted);margin-top:3px}
    .nav-list{display:grid;gap:8px}
    .nav-btn{width:100%;display:flex;align-items:center;gap:14px;padding:15px 17px;border:0;background:transparent;color:#506b63;border-radius:16px;font-weight:700;text-align:left;min-height:58px}
    .nav-btn:hover,.nav-btn[aria-current="page"]{background:#e9f4ed;color:var(--green-dark)}
    .nav-ico{font-size:1.35rem;line-height:1}
    .main-wrap{min-width:0;padding:25px 48px 75px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:0 auto 34px;max-width:1120px}
    .eyebrow{color:var(--muted);font-size:.83rem;font-weight:800;letter-spacing:.10em;text-transform:uppercase}
    .topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .demo-pill{border-radius:99px;color:#586b63;border:1px solid #d8e4d9;padding:7px 11px;font-size:.77rem;font-weight:800;white-space:nowrap}
    .mode-switch{display:inline-flex;background:#e8eee7;border-radius:99px;padding:5px;gap:3px}
    .mode-switch button{border:0;border-radius:99px;background:transparent;color:#60736a;font-weight:800;font-size:.85rem;padding:10px 13px;white-space:nowrap;min-height:44px}
    .mode-switch button[aria-pressed="true"]{background:var(--surface);color:var(--green-dark);box-shadow:0 2px 8px #152d2214}
    .content{max-width:1120px;margin:0 auto}
    .intro{margin-bottom:26px}
    .intro h1{font-size:clamp(2rem,3.4vw,3.45rem);font-weight:850;letter-spacing:-.055em;line-height:1.12;margin:7px 0 10px}
    .intro p{margin:0;color:var(--muted);font-size:1.09rem;max-width:680px}
    .columns{display:grid;grid-template-columns:minmax(0,1.57fr) minmax(290px,1fr);gap:21px;align-items:start}
    .stack{display:grid;gap:21px}
    .panel{background:var(--surface);border:1px solid var(--line);border-radius:25px;padding:27px;box-shadow:var(--shadow)}
    .panel h2{font-size:1.27rem;letter-spacing:-.03em;margin:0 0 7px}
    .panel p{color:var(--muted);margin:0}
    .primary-panel{background:linear-gradient(145deg,#eaf7ee,#f8fcf4 63%,#fff9ef);padding:32px;border-color:#d2e8d9;min-height:410px;position:relative;overflow:hidden}
    .primary-panel::after{content:"";position:absolute;border:25px solid #d9f1df;border-radius:100%;height:230px;width:230px;right:-115px;top:-142px;opacity:.8;pointer-events:none}
    .tiny-heading{font-size:.85rem;text-transform:uppercase;font-weight:800;letter-spacing:.10em;color:#4b7565}
    .primary-panel h2{font-size:clamp(1.75rem,3vw,2.6rem);letter-spacing:-.05em;line-height:1.18;margin:20px 0 11px;max-width:550px}
    .primary-panel p{color:#42665a;max-width:430px;font-size:1.02rem;line-height:1.6}
    .primary-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:27px 0 19px;position:relative;z-index:1}
    .action-btn{border:2px solid transparent;min-height:102px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:10px;flex-direction:column;text-align:center;padding:16px 9px;font-size:1.1rem;font-weight:830;transition:transform .13s,background .13s}
    .action-btn:hover{transform:translateY(-2px)}
    .action-btn .btn-symbol{font-size:1.8rem;line-height:1}
    .action-btn.primary{background:var(--green);color:#fff;box-shadow:0 9px 20px #11746128}
    .action-btn.primary:hover{background:var(--green-dark)}
    .action-btn.secondary{background:#fff;color:var(--orange);border-color:#f0d6c4}
    .action-btn.secondary:hover{background:#fff6f0}
    .privacy-note{color:#527365;font-size:.85rem;display:flex;align-items:center;gap:9px}
    .status-pill{display:inline-flex;gap:8px;align-items:center;border-radius:99px;background:#d9efdf;color:#165d49;padding:9px 13px;font-weight:800;font-size:.88rem}
    .status-pill.alert{background:#ffdfd4;color:#973d2b}
    .small-btn{border:1px solid #d8e5d9;color:var(--green-dark);background:#fff;border-radius:12px;padding:10px 14px;font-weight:750;min-height:45px}
    .small-btn:hover{background:#f1f8f2}
    .section-head{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:19px}
    .section-head p{font-size:.9rem}
    .reminder-list{display:grid;gap:12px}
    .reminder-row{display:flex;align-items:center;gap:12px;background:#f9faf6;border:1px solid #e8ece6;border-radius:17px;padding:12px;min-height:70px}
    .task-icon{width:42px;height:42px;display:grid;place-items:center;font-size:1.3rem;border-radius:12px;background:#edf2e9;flex:none}
    .task-copy{flex:1;min-width:0}
    .task-copy strong{display:block;line-height:1.27}
    .task-copy small{color:var(--muted);font-size:.81rem}
    .round-check{width:47px;height:47px;border:2px solid #aacbb7;background:white;color:var(--green);border-radius:15px;font-weight:bold;font-size:1.4rem;flex:none}
    .round-check.done{background:var(--green);border-color:var(--green);color:#fff}
    .panel-link{border:0;background:none;color:var(--green);font-weight:800;padding:6px;text-decoration:underline;text-underline-offset:4px}
    .little-illustration{font-size:2.2rem;width:58px;height:58px;background:#e9f5ec;display:grid;place-items:center;border-radius:20px;margin-bottom:15px}
    .connection-note{background:var(--peach);border:1px solid #f9e6ce;border-radius:16px;padding:16px;margin-top:16px;color:#705239;font-size:.95rem}
    .field{display:grid;gap:8px;margin:17px 0}
    .field label{font-weight:800;color:#24493e}
    .field input,.field textarea,.field select{width:100%;min-height:53px;border:1.5px solid #c9d9cd;border-radius:14px;padding:12px 13px;background:#fff;color:var(--ink)}
    .field textarea{min-height:120px;resize:vertical}
    .mini-caption{color:var(--muted);font-size:.85rem}
    .btn{border:0;border-radius:15px;padding:14px 18px;min-height:52px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px}
    .btn.green{background:var(--green);color:#fff}
    .btn.green:hover{background:var(--green-dark)}
    .btn.outline{background:#fff;color:var(--green-dark);border:1px solid #b8d0be}
    .btn.wide{width:100%}
    .btn.warning{background:#fff0e8;color:#a24b24;border:1px solid #f2d3c0}
    .mood-options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}
    .mood-btn{background:#fff;border:2px solid #e4ebe4;border-radius:16px;padding:13px 9px;font-weight:750;min-height:91px;display:grid;justify-items:center;gap:6px;color:var(--ink)}
    .mood-btn span{font-size:1.65rem;line-height:1}
    .mood-btn[aria-pressed="true"]{border-color:var(--green);background:#e9f6ed}
    .history-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px;margin:22px 0 7px}
    .day-cell{display:grid;justify-items:center;gap:7px;min-width:0}
    .day-name{font-weight:750;font-size:.76rem;color:#607970}
    .day-dot{width:100%;min-height:55px;border-radius:14px;background:#e8efea;color:#5e796b;display:grid;place-items:center;font-size:1.3rem;font-weight:800}
    .day-dot.ok{background:#e1f4e8;color:#16735c}
    .day-dot.help{background:#fae0d9;color:#af502d}
    .day-dot.missed{background:#fce8e3;color:#a23c33}
    .day-dot.today{outline:2px solid #568c72;outline-offset:2px}
    .legend{display:flex;gap:15px;flex-wrap:wrap;color:var(--muted);font-size:.76rem;margin-top:14px}
    .legend span{display:flex;gap:5px;align-items:center}
    .legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
    .metric-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .metric{border-radius:18px;background:#f7f8f3;padding:16px}
    .metric .num{font-size:1.9rem;font-weight:850;letter-spacing:-.07em;line-height:1.25}
    .metric small{color:var(--muted)}
    .family-summary{border:1px solid #cce3d7;background:#ecf7ef;border-radius:20px;padding:20px;margin-top:20px}
    .family-summary.needs-help{border-color:#f1c7b4;background:#fff0e7}
    .family-summary.pending{border-color:#e3dfbe;background:#fffaeb}
    .family-summary h3{margin:0 0 5px;font-size:1.22rem}
    .family-summary p{margin:0;color:#52665f}
    .info-bullets{display:grid;gap:13px;margin:17px 0 0;padding:0;list-style:none}
    .info-bullets li{display:flex;align-items:start;gap:10px;color:#536b62}
    .list-separator{height:1px;background:var(--line);margin:20px 0}
    .wide-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(290px,1fr);gap:21px}
    .help-choice-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:19px 0}
    .help-choice{border:2px solid var(--line);border-radius:15px;background:white;padding:16px;text-align:left;font-weight:800;min-height:76px;color:var(--ink)}
    .help-choice[aria-pressed="true"]{border-color:var(--green);background:#eaf7ee}
    .inline-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
    .add-reminder{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
    .add-reminder .field{margin:0}
    .muted-card{padding:18px;background:#f7faf5;border-radius:15px;color:#536a5f}
    .badge{display:inline-block;background:#e9f1e9;color:#426f59;border-radius:9px;padding:4px 8px;font-size:.76rem;font-weight:750}
    .settings-row{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding:20px 0}
    .settings-row:last-child{border:0}
    .settings-row p{margin:4px 0 0;color:var(--muted);font-size:.89rem}
    .segmented{display:flex;background:#f0f4ed;border-radius:13px;padding:4px;gap:3px;flex:none}
    .segmented button{border:0;background:transparent;border-radius:10px;padding:10px 13px;min-width:42px;min-height:44px;font-weight:850;color:var(--ink)}
    .segmented button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 4px #0001}
    .switch{width:62px;min-width:62px;height:36px;background:#d7dfd5;border:0;border-radius:100px;position:relative}
    .switch::after{content:"";display:block;width:26px;height:26px;position:absolute;top:5px;left:5px;border-radius:50%;background:white;transition:transform .2s}
    .switch[aria-pressed="true"]{background:var(--green)}
    .switch[aria-pressed="true"]::after{transform:translateX(26px)}
    .notice{border-left:4px solid var(--green);background:#f1f8f2;border-radius:10px;padding:14px 17px;color:#3f6456;font-size:.91rem;margin-top:20px}
    .notice.warning{border-color:#df8b49;background:#fff3e9;color:#8c4d2e}
    .mobile-nav{display:none}
    .modal-backdrop{position:fixed;inset:0;background:#142c2788;display:grid;place-items:center;z-index:20;padding:16px}
    .modal{width:min(100%,530px);max-height:92vh;overflow:auto;background:white;padding:30px;border-radius:25px;box-shadow:0 30px 90px #0003}
    .modal h2{font-size:1.8rem;letter-spacing:-.04em;margin:8px 0 4px}
    .modal p{color:var(--muted);margin:0}
    .modal-heading{display:flex;align-items:start;justify-content:space-between;gap:12px}
    .icon-button{border:0;background:#f0f4ee;border-radius:12px;width:46px;height:46px;font-size:1.3rem;flex:none}
    .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
    .toast{position:fixed;right:24px;bottom:24px;background:#143f34;color:#fff;padding:16px 21px;border-radius:14px;z-index:50;max-width:min(440px,calc(100vw - 32px));font-weight:750;box-shadow:0 15px 35px #0003}
    body.high-contrast{--bg:#f9fbf6;--panel:#fff;--ink:#061e18;--muted:#263d35;--line:#718c7d;--green:#06573f;--green-dark:#003e2c;--green-light:#d9f6dd;--focus:#1546a3}
    @media (max-width:1070px){.app-shell{grid-template-columns:210px 1fr}.main-wrap{padding:25px 22px 72px}.columns,.wide-grid{grid-template-columns:1fr}.primary-panel{min-height:0}}
    @media (max-width:690px){.app-shell{display:block}aside{display:none}.main-wrap{padding:20px 16px 102px}.topbar{margin-bottom:26px;align-items:start}.topbar .eyebrow{font-size:.7rem}.mode-switch{gap:1px;padding:3px}.mode-switch button{padding:8px 10px;font-size:.73rem}.demo-pill{display:none}.intro h1{font-size:2.15rem}.intro p{font-size:1rem}.panel{padding:21px;border-radius:22px}.primary-panel{padding:23px;min-height:0}.primary-panel h2{margin-top:15px;font-size:1.95rem}.primary-actions{gap:10px}.action-btn{font-size:.99rem;min-height:100px;padding:12px 6px}.metric-row{grid-template-columns:repeat(2,minmax(0,1fr))}.history-row{gap:5px}.day-dot{min-height:48px;font-size:1.07rem}.day-name{font-size:.69rem}.mobile-nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);z-index:9;background:#fffefaee;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:7px 6px max(8px,env(safe-area-inset-bottom))}.mobile-nav button{border:0;background:transparent;display:grid;justify-items:center;gap:1px;color:#60786b;font-size:.67rem;padding:5px 1px;min-height:60px;font-weight:800;border-radius:12px}.mobile-nav button b{font-size:1.36rem}.mobile-nav button[aria-current="page"]{background:#e8f5eb;color:#12644c}.toast{bottom:92px;right:16px}}
    @media (max-width:390px){.topbar{flex-direction:column;gap:10px}.help-choice-list{grid-template-columns:1fr}.add-reminder{grid-template-columns:1fr}.mood-options{gap:5px}.mood-btn{padding:10px 3px;font-size:.85rem}}
    @media (prefers-reduced-motion:reduce){*,*::after{transition:none!important;scroll-behavior:auto!important}}
    .auth-container{max-width:530px;margin:5vh auto}
    .auth-container h1{font-size:2rem;letter-spacing:-.04em;margin:6px 0 10px}
    .auth-container p{color:var(--muted)}
    .auth-actions{display:grid;gap:12px;margin-top:22px}
    .auth-switch{background:none;border:0;text-decoration:underline;color:var(--green-dark);padding:12px;font-weight:800}
    .code-display{font-size:1.6rem;letter-spacing:.075em;font-weight:850;overflow-wrap:anywhere;background:#e7f5ed;padding:15px;border-radius:14px;user-select:all}
    .error-notice{color:#9d2b30;background:#fff0ef;border:1px solid #e9b1ad;padding:14px;border-radius:13px;margin:14px 0}
    .success-notice{color:#135b46;background:#e6f7eb;padding:14px;border-radius:13px;margin:14px 0}
    .loading{padding:35px;font-size:1.12rem}
    .topbar .small-btn{white-space:nowrap}

    /* CARE PLANNER — spacious task management inspired by familiar to-do apps. */
    .planner-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:12px;align-items:stretch;margin-bottom:22px}
    .planner-stat{background:linear-gradient(145deg,#f7fbf6,#eaf6ed);border:1px solid #dbe9dc;border-radius:20px;padding:15px 19px;display:flex;flex-direction:column;gap:5px}
    .planner-stat span{font-size:.83rem;color:#5e746b;font-weight:750}
    .planner-stat strong{font-size:2rem;font-weight:850;letter-spacing:-.07em;line-height:1.1}
    .planner-new{min-width:150px}
    .planner-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(265px,.9fr);gap:22px;align-items:start}
    .planner-layout > .stack,.planner-layout .panel{min-width:0;max-width:100%}
    .planner-layout.calendar-hidden{grid-template-columns:minmax(0,1fr)}
    .planner-aside[hidden]{display:none!important}
    .planner-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-width:0}
    .planner-pills{min-width:0}
    .planner-toggle{min-height:46px;padding:10px 14px;white-space:nowrap;flex:none}
    .planner-calendar{width:100%;min-width:0}
    .planner-pills{display:flex;gap:5px;flex-wrap:wrap;background:#f0f4ee;padding:5px;border-radius:16px}
    .planner-pills button{flex:1;min-width:88px;background:transparent;color:#526f60;border:0;border-radius:12px;padding:11px 12px;min-height:47px;font-weight:800}
    .planner-pills button[aria-pressed="true"]{background:white;color:#087056;box-shadow:0 3px 9px #144c2a15}
    .planner-filters{display:flex;gap:8px;overflow-x:auto;padding:16px 0 10px;scrollbar-width:thin}
    .planner-filters button{border:1px solid #dce7dc;color:#557266;background:#fff;border-radius:99px;padding:8px 13px;min-height:41px;white-space:nowrap;font-weight:750;font-size:.88rem}
    .planner-filters button[aria-pressed="true"]{background:#e5f5ec;color:#087157;border-color:#80bba1}
    .planner-list-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:11px 0 16px}
    .planner-list-heading h2{font-size:1.35rem}
    .care-task-list{display:grid;gap:10px}
    .care-task-row{display:flex;gap:12px;align-items:center;border-radius:17px;background:#fafbf8;border:1px solid #e5ebe5;padding:13px 14px;min-height:86px}
    .care-task-row.care-task-done{background:#f0f7ef}
    .care-task-symbol{flex:none;width:49px;height:49px;border-radius:15px;display:grid;place-items:center;font-size:1.5rem;background:#e9f1e9}
    .care-task-body{min-width:0;flex:1}
    .care-task-body strong{display:block;font-size:1.02rem;line-height:1.35;overflow-wrap:anywhere}
    .care-task-done .care-task-body strong{text-decoration:line-through;text-decoration-color:#7c9785;color:#61776b}
    .care-task-metadata{display:flex;flex-wrap:wrap;gap:5px 10px;color:#57736b;margin-top:5px;font-size:.78rem;font-weight:730}
    .care-task-metadata span:first-child{color:#0a7357}
    .care-category{background:#eaf2e8;border-radius:99px;padding:1px 9px}
    .care-task-buttons{display:flex;align-items:center;gap:6px;flex:none}
    .care-complete{background:white;border:2px solid #9bbbac;color:#117461;border-radius:15px;height:52px;width:52px;font-size:1.5rem;font-weight:800;flex:none}
    .care-complete.is-complete{background:#117461;color:white;border-color:#117461}
    .care-status{font-size:.75rem;background:#f3efdd;border-radius:8px;color:#8c6a29;padding:6px 9px;font-weight:850;white-space:nowrap}
    .care-status.checked{background:#dff2e8;color:#08704f}
    .care-edit{background:transparent;border:1px solid #dae4da;border-radius:10px;width:38px;height:40px;color:#547467;font-size:1.1rem}
    .task-details{font-size:.88rem!important;color:#5e776c!important;margin:6px 0 0!important;white-space:pre-wrap;overflow-wrap:anywhere}
    .task-from{display:block;color:#6b8175;margin-top:7px;font-size:.76rem}
    .task-empty{padding:30px 12px;text-align:center;border:1px dashed #d2e2d5;border-radius:17px;color:#6b8073}
    .task-empty span{display:block;font-size:2rem;margin-bottom:7px}.task-empty strong{display:block;color:#275347;font-size:1.05rem}
    .task-empty p{font-size:.9rem;margin:6px 0 0}
    .planner-date-label{padding:13px 2px 2px;color:#526d62;font-size:.84rem;font-weight:800;letter-spacing:.035em;text-transform:uppercase}
    .calendar-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
    .calendar-header h2{font-size:1.12rem;margin:6px 0 0}
